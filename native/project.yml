name: Moodboard
options:
  bundleIdPrefix: io.github.shariqmalik10
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Moodboard:
    type: application
    platform: macOS
    sources:
      - path: Moodboard
        excludes:
          - DESIGN.md
    settings:
      base:
        PRODUCT_NAME: Moodboard
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shariqmalik10.moodboard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Moodboard/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Moodboard
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ENABLE_APP_SANDBOX: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.shariqmalik10.moodboard.debug
          INFOPLIST_KEY_CFBundleDisplayName: Moodboard Debug
    postCompileScripts:
      - name: Copy the web components
        basedOnDependencyAnalysis: false
        script: |
          set -e
          WEB="$SRCROOT/../dist"
          if [ ! -f "$WEB/stage.html" ]; then
            echo "error: $WEB is missing. Run npm run build in the project root first."
            exit 1
          fi
          rsync -a --delete --exclude index.html "$WEB/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web/"
          SYNC="$SRCROOT/../dist-sync"
          if [ ! -f "$SYNC/server.mjs" ]; then
            echo "error: $SYNC is missing. Run npm run build in the project root first."
            exit 1
          fi
          rsync -a --delete "$SYNC/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/sync/"
          DEMO="$SRCROOT/../dist-demo"
          if [ ! -f "$DEMO/package.json" ]; then
            echo "error: $DEMO is missing. Run npm run build in the project root first."
            exit 1
          fi
          rsync -a --delete "$DEMO/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/demo/"
  MoodboardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MoodboardTests
    dependencies:
      - target: Moodboard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Moodboard.app/Contents/MacOS/Moodboard"
schemes:
  Moodboard:
    build:
      targets:
        Moodboard: all
        MoodboardTests: [test]
    test:
      targets:
        - MoodboardTests
